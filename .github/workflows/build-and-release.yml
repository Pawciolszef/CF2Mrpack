name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --name "CF2Mrpack" --clean main.py

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/CF2Mrpack.exe")) {
            Write-Error "dist/CF2Mrpack.exe was not found!"
            exit 1
          }
          $hash = (Get-FileHash dist/CF2Mrpack.exe -Algorithm SHA256).Hash
          Set-Content -Path "dist/CF2Mrpack.exe.sha256" -Value "$hash  CF2Mrpack.exe"
          Write-Host "Build successful! SHA256: $hash"

      - name: Upload artifact (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: CF2Mrpack-windows
          path: |
            dist/CF2Mrpack.exe
            dist/CF2Mrpack.exe.sha256
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CF2Mrpack.exe
            dist/CF2Mrpack.exe.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
